<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fluffy Acres 3D</title>
  <link rel="stylesheet" href="3d.css" />
</head>
<body>
  <div id="app"></div>

  <div class="hud">
    <div class="report">
      <span class="brand">Fluffy Acres</span>
      <span>Day <b id="day" class="num">1</b><span class="of">/30</span></span>
      <span id="weather">☀️ Sunny</span>
      <span>🪙 <b id="gold" class="num">20</b>g</span>
      <span id="energy" class="energy" title="Energy — every action costs 1"></span>
    </div>

    <div class="seedbar">
      <div id="seeds" class="seeds"></div>
      <div class="hint">WASD walk &middot; <b>E</b> work the tile &middot; <b>1–3</b> pick seed &middot; <b>N</b> end day</div>
    </div>

    <button id="end-day" class="end-day">🌙 End day</button>

    <ul id="log" class="log"></ul>
  </div>

  <div id="night" class="night"><div id="night-text"></div></div>

  <div id="gameover" class="gameover hidden">
    <div class="gameover-card">
      <h2>The season is over</h2>
      <p class="final">🪙 <b id="final-gold" class="num">0</b> gold</p>
      <p class="final-note">Can you beat it next season?</p>
      <button id="play-again" class="end-day">Play again</button>
    </div>
  </div>

  <script src="../lib/three.min.js"></script>
  <script src="engine.js"></script>
  <script src="3d.js"></script>
</body>
</html>
