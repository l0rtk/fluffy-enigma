<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Playground</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; overflow: hidden; background: #bfe0f5; font-family: system-ui, sans-serif; }
    #app, #app canvas { position: fixed; inset: 0; display: block; }
    .hint {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      padding: 0.45rem 0.9rem;
      background: rgba(248, 250, 238, 0.92);
      border: 1px solid #c9d2ac;
      border-radius: 10px;
      color: #6b7355;
      font-size: 0.85rem;
      white-space: nowrap;
    }
    .hint b { color: #2f331d; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div class="hint"><b>WASD</b> walk &middot; <b>E</b> interact &middot; open <b>playground.js</b> and start building</div>

  <script src="lib/three.min.js"></script>
  <script src="lib/GLTFLoader.js"></script>
  <script src="playground.js"></script>
</body>
</html>
